name: Build DockHosting Remux binary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-remux-binary.yml"

permissions:
  contents: write

env:
  # Track the latest tested stable upstream release instead of the old 0.36-era fork snapshot.
  REMUX_REPO: lostb1t/remux
  REMUX_REF: v0.38.2
  CUSTOM_REPO: https://github.com/luinog1/remux-render.git
  RELEASE_TAG: dockhosting-bin

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current upstream Remux
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REMUX_REPO }}
          ref: ${{ env.REMUX_REF }}
          fetch-depth: 0

      - name: Reapply safe custom performance changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DockHosting build"
          git config user.email "actions@users.noreply.github.com"
          git remote add luinog "${CUSTOM_REPO}"
          git fetch --no-tags luinog             0de6fdfec5ba1422b262e463df1162754a36370c             75779d75f0c73ed67b5834f73d1edecdc79e7520
          git cherry-pick 0de6fdfec5ba1422b262e463df1162754a36370c
          git cherry-pick 75779d75f0c73ed67b5834f73d1edecdc79e7520

      - name: Enable AIOMetadata catalogs by default
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/remux-server/src/addons/stremio.rs")
          src = path.read_text()

          needle = """        Ok(manifest
            .catalogs
            .into_iter()"""
          replacement = """        // DockHosting customization: AIOMetadata is the library/catalog provider.
        // New catalogs published by its manifest should join the library automatically.
        // Persisted per-catalog overrides still win in resolve_catalogs(), so this does
        // not forcibly re-enable a catalog the user explicitly disabled.
        let auto_enable_catalogs = self
            .manifest_url
            .to_string()
            .contains("aiometadata.fortheweak.cloud");

        Ok(manifest
            .catalogs
            .into_iter()"""
          if needle not in src:
              raise SystemExit("upstream stremio catalog layout changed; refusing an unsafe patch")
          src = src.replace(needle, replacement, 1)

          needle = """                CatalogInfo {
                    collection_media_kind:"""
          replacement = """                CatalogInfo {
                    default_enabled: auto_enable_catalogs,
                    collection_media_kind:"""
          if needle not in src:
              raise SystemExit("CatalogInfo layout changed; refusing an unsafe patch")
          src = src.replace(needle, replacement, 1)
          path.write_text(src)

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build remux-server
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked -p remux-server

      - name: Prepare binary
        run: |
          strip target/release/remux-server
          cp target/release/remux-server remux-server-linux-amd64
          chmod +x remux-server-linux-amd64
          sha256sum remux-server-linux-amd64 > remux-server-linux-amd64.sha256

      - name: Publish fixed DockHosting release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DockHosting Remux binary" \
            --notes "Prebuilt remux-server from ${REMUX_REPO}@${REMUX_REF}, with DockHosting performance patches and AIOMetadata catalog auto-enable." \
            --prerelease \
            remux-server-linux-amd64 \
            remux-server-linux-amd64.sha256
