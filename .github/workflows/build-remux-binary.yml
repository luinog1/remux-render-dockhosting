name: Build DockHosting Remux binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream Remux v0.38.2
        uses: actions/checkout@v4
        with:
          repository: lostb1t/remux
          ref: v0.38.2
          fetch-depth: 0

      - name: Reapply DockHosting performance patches
        run: |
          set -euo pipefail
          git config user.name "DockHosting build"
          git config user.email "actions@users.noreply.github.com"
          git remote add luinog https://github.com/luinog1/remux-render.git
          git fetch --no-tags luinog 0de6fdfec5ba1422b262e463df1162754a36370c 75779d75f0c73ed67b5834f73d1edecdc79e7520
          git cherry-pick 0de6fdfec5ba1422b262e463df1162754a36370c
          git cherry-pick 75779d75f0c73ed67b5834f73d1edecdc79e7520

      - name: Apply AIOMetadata auto-library adaptation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/remux-server/src/addons/stremio.rs")
          src = path.read_text()
          needle = """        Ok(manifest
                      .catalogs
                      .into_iter()"""
          replacement = """        // DockHosting: auto-enable newly published AIOMetadata catalogs.
                  // Persisted per-catalog overrides still win in resolve_catalogs().
                  let auto_enable_catalogs = self
                      .manifest_url
                      .to_string()
                      .contains("aiometadata.fortheweak.cloud");

                  Ok(manifest
                      .catalogs
                      .into_iter()"""
          if needle not in src:
              raise SystemExit("upstream Stremio catalog layout changed")
          src = src.replace(needle, replacement, 1)
          needle = """                CatalogInfo {
                              collection_media_kind:"""
          replacement = """                CatalogInfo {
                              default_enabled: auto_enable_catalogs,
                              collection_media_kind:"""
          if needle not in src:
              raise SystemExit("upstream CatalogInfo layout changed")
          path.write_text(src.replace(needle, replacement, 1))
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build remux-server
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked -p remux-server

      - name: Publish fixed DockHosting release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          strip target/release/remux-server
          cp target/release/remux-server remux-server-linux-amd64
          chmod +x remux-server-linux-amd64
          sha256sum remux-server-linux-amd64 > remux-server-linux-amd64.sha256
          gh release delete dockhosting-bin --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create dockhosting-bin --repo "${GITHUB_REPOSITORY}" --title "DockHosting Remux binary" --notes "Remux v0.38.2 with DockHosting performance patches and AIOMetadata catalog auto-enable." --prerelease remux-server-linux-amd64 remux-server-linux-amd64.sha256
