name: Build DockHosting Remux binary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-remux-binary.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream Remux v0.38.2
        uses: actions/checkout@v4
        with:
          repository: lostb1t/remux
          ref: v0.38.2
          fetch-depth: 0

      - name: Reapply DockHosting performance patches
        run: |
          set -euo pipefail
          git config user.name "DockHosting build"
          git config user.email "actions@users.noreply.github.com"
          git remote add luinog https://github.com/luinog1/remux-render.git
          git fetch --no-tags luinog 0de6fdfec5ba1422b262e463df1162754a36370c 75779d75f0c73ed67b5834f73d1edecdc79e7520
          git cherry-pick 0de6fdfec5ba1422b262e463df1162754a36370c
          git cherry-pick 75779d75f0c73ed67b5834f73d1edecdc79e7520

      - name: Auto-enable new AIOMetadata catalogs
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("crates/remux-server/src/addons/stremio.rs"); s=p.read_text(); a="        Ok(manifest\\n            .catalogs\\n            .into_iter()"; b="        let auto_enable_catalogs = self.manifest_url.to_string().contains(\\\"aiometadata.fortheweak.cloud\\\");\\n\\n        Ok(manifest\\n            .catalogs\\n            .into_iter()"; assert a in s, "upstream Stremio catalog layout changed"; s=s.replace(a,b,1); a="                CatalogInfo {\\n                    collection_media_kind:"; b="                CatalogInfo {\\n                    default_enabled: auto_enable_catalogs,\\n                    collection_media_kind:"; assert a in s, "upstream CatalogInfo layout changed"; p.write_text(s.replace(a,b,1))'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build remux-server
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked -p remux-server

      - name: Prepare binary
        run: |
          strip target/release/remux-server
          cp target/release/remux-server remux-server-linux-amd64
          chmod +x remux-server-linux-amd64
          sha256sum remux-server-linux-amd64 > remux-server-linux-amd64.sha256

      - name: Publish fixed DockHosting release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dockhosting-bin --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create dockhosting-bin --repo "${GITHUB_REPOSITORY}" --title "DockHosting Remux binary" --notes "Remux v0.38.2 with DockHosting patches and AIOMetadata catalog auto-enable." --prerelease remux-server-linux-amd64 remux-server-linux-amd64.sha256
