name: Build DockHosting Remux binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest upstream Remux main
        uses: actions/checkout@v4
        with:
          repository: lostb1t/remux
          ref: main
          fetch-depth: 0

      - name: Record upstream revision
        run: |
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Preserve DockHosting SQLite relations index
        run: |
          cat > crates/remux-server/migrations/202609280001_media_relations_left_weight_idx.sql <<'SQL'
          CREATE INDEX IF NOT EXISTS idx_media_relations_left_weight_right
              ON media_relations(left_media_id, weight, right_media_id);
          SQL

      - name: Apply AIOMetadata auto-library adaptation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/remux-server/src/addons/stremio.rs")
          src = path.read_text()
          needle = """        Ok(manifest
                      .catalogs
                      .into_iter()"""
          replacement = """        // DockHosting: auto-enable newly published AIOMetadata catalogs.
                  // Persisted per-catalog overrides still win in resolve_catalogs().
                  let auto_enable_catalogs = self
                      .manifest_url
                      .to_string()
                      .contains("aiometadata.fortheweak.cloud");

                  Ok(manifest
                      .catalogs
                      .into_iter()"""
          if needle not in src:
              raise SystemExit("upstream Stremio catalog layout changed")
          src = src.replace(needle, replacement, 1)
          needle = """                CatalogInfo {
                              collection_media_kind:"""
          replacement = """                CatalogInfo {
                              default_enabled: auto_enable_catalogs,
                              collection_media_kind:"""
          if needle not in src:
              raise SystemExit("upstream CatalogInfo layout changed")
          path.write_text(src.replace(needle, replacement, 1))
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build remux-server
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked -p remux-server

      - name: Publish DockHosting release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          strip target/release/remux-server
          cp target/release/remux-server remux-server-linux-amd64
          chmod +x remux-server-linux-amd64
          sha256sum remux-server-linux-amd64 > remux-server-linux-amd64.sha256
          gh release delete dockhosting-bin --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create dockhosting-bin             --repo "${GITHUB_REPOSITORY}"             --title "DockHosting Remux binary"             --notes "Latest lostb1t/remux main at ${UPSTREAM_SHA}, with DockHosting SQLite index and AIOMetadata catalog auto-enable."             --prerelease             remux-server-linux-amd64 remux-server-linux-amd64.sha256
