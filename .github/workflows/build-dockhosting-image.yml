name: Build and publish DockHosting image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.image"
      - "docker-entrypoint.sh"
      - "remux-backup.sh"
      - ".github/workflows/build-dockhosting-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.image
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/luinog1/remux-render-dockhosting:latest
            ghcr.io/luinog1/remux-render-dockhosting:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
